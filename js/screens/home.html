<section id="homeScreen" class="screen active">
                <h2 class="screen-heading">Overview</h2>
                <div class="home-balance-grid">
                    <div class="stat"><div class="label">Cash balance · this month</div><div id="homeCashBalance" class="value">₦0</div></div>
                    <div class="stat"><div class="label">Bank balance · this month</div><div id="homeTransferBalance" class="value">₦0</div></div>
                </div>
                <div class="stat total home-total" style="margin-top:12px"><div class="label">Total remaining · this month</div><div id="homeTotalBalance" class="value">₦0</div></div>
                <h2 style="margin:22px 0 12px">Today's income</h2>
                <section class="grid">
                <div class="stat">
                    <div class="label">Today's cash income</div>
                    <div id="todayCashStat" class="value">₦0</div>
                </div>
                <div class="stat">
                    <div class="label">Today's bank receipts</div>
                    <div id="todayTransferStat" class="value">₦0</div>
                </div>
                <div class="stat total">
                    <div class="label">Today's total income</div>
                    <div id="todayTotalStat" class="value">₦0</div>
                </div>
            </section>
                <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Quick actions</h2></div><div class="row" style="margin-top:12px"><button class="btn" type="button" data-go="incomeScreen">+ Add income</button><button class="btn secondary" type="button" data-go="transferScreen">⇄ Move money</button></div></div>
            </section>
